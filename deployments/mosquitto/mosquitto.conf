# MQTT broker configuration for smarthome-hub.
#
# AppSec (ADR-0002): anonymous access is FORBIDDEN from the very first commit,
# development included. Open MQTT brokers are among the most heavily scanned
# assets on the internet, and "I'll lock it down later" is precisely how
# exposures happen.

listener 1883
protocol mqtt

# --- Authentication -----------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Authorization (least privilege) ------------------------------------------
# Each device may only publish under its own topic path. A compromised device
# cannot forge another device's telemetry nor issue commands.
acl_file /mosquitto/config/acl

# --- Persistence --------------------------------------------------------------
# Retained messages (device state) survive a broker restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# --- Logging ------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Limits -------------------------------------------------------------------
# Abuse containment: a device with buggy firmware must not be able to flood
# the hub.
max_inflight_messages 20
max_queued_messages 1000
max_packet_size 8192
